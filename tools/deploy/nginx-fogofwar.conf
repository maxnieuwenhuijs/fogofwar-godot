# F4.4a — nginx-site voor de Fog of War backend (sjabloon; droplet-setup.sh
# vervangt __DOMEIN__ en zet hem in /etc/nginx/sites-available/fogofwar).
# Alleen poort 80 hier: certbot --nginx voegt de 443-server en de redirect toe.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMEIN__;

    # Acties en logins zijn kleine JSON-bodies; de view is een antwoord.
    client_max_body_size 256k;

    location / {
        limit_req zone=fogofwar burst=30 nodelay;
        limit_conn fogofwar_conn 20;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Een WebSocket mag lang stil zijn (turn-based).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
