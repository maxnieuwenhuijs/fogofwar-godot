# F4.4a — http-context voor de Fog of War-site (/etc/nginx/conf.d/fogofwar-http.conf).
# Rate-limiting hoort in nginx: achter de proxy ziet Node alleen 127.0.0.1.
# Een client pollt 2x per seconde en doet bij het verbinden 4-5 verzoeken
# vlak na elkaar; twee spelers achter één NAT delen een IP. 10 r/s met een
# burst van 30 laat dat ruim door en houdt een tikkende loop tegen.
limit_req_zone $binary_remote_addr zone=fogofwar:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=fogofwar_conn:10m;

# WebSocket-upgrade (route /matches/:id/ws, gebruikt vanaf F4.3j).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
